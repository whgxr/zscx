services:
  mysql:
    image: mysql:5.7
    container_name: zscx-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zscx}
      MYSQL_USER: ${MYSQL_USER:-zscx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zscx123456}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zscx-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: zscx-web:local
    container_name: zscx-web
    restart: always
    ports:
      - "${WEB_PORT:-777}:3000"
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-zscx}:${MYSQL_PASSWORD:-zscx123456}@mysql:3306/${MYSQL_DATABASE:-zscx}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRES_IN=7d
      - UPLOAD_DIR=./public/uploads
      - MAX_FILE_SIZE=10485760
      - NEXT_PUBLIC_APP_NAME=${APP_NAME:-房屋征收调查系统}
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads
      - backups:/app/backups
    command: sh -c "node prisma/docker-migrate.js && npm start"

volumes:
  # mysql 数据卷显式指向既有真实数据卷（docker 项目下创建的 docker_mysql_data）
  mysql_data:
    external: true
    name: docker_mysql_data
  uploads:
  backups:
  redis_data:
