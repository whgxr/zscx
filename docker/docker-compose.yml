services:
  mysql:
    image: mysql:5.7
    container_name: zscx-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zscx}
      MYSQL_USER: ${MYSQL_USER:-zscx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-zscx123456}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=1000
      --explicit_defaults_for_timestamp=true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: zscx-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: zscx-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-zscxadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-zscxsecret123456}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/127.0.0.1/9000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  onlyoffice-ds:
    # 国内服务器如拉取缓慢，可改用镜像源：docker.m.daocloud.io/onlyoffice/documentserver:latest
    image: onlyoffice/documentserver:latest
    container_name: onlyoffice-ds
    restart: always
    ports:
      - "${ONLYOFFICE_DS_PORT:-8088}:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change-this-secret-please}
    volumes:
      # 数据/日志/缓存/数据库持久化，容器重建不丢失
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_cache:/var/lib/onlyoffice
      - onlyoffice_db:/var/lib/postgresql
      # 中文字体持久化（只读）：将字体文件放入 docker/onlyoffice-fonts/ 目录
      - ./onlyoffice-fonts:/usr/share/fonts/truetype/custom:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/healthcheck || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: zscx-web:local
    container_name: zscx-web
    restart: always
    ports:
      - "${WEB_PORT:-777}:3000"
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER:-zscx}:${MYSQL_PASSWORD:-zscx123456}@mysql:3306/${MYSQL_DATABASE:-zscx}?sslmode=disable
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRES_IN=7d
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - UPLOAD_DIR=./public/uploads
      - MAX_FILE_SIZE=10485760
      - NEXT_PUBLIC_APP_NAME=${APP_NAME:-房屋征收调查系统}
      - NEXT_PUBLIC_BASE_URL=${NEXT_PUBLIC_BASE_URL:-http://127.0.0.1:777}
      - NODE_ENV=production
      # ONLYOFFICE Document Server（模板编辑器）：onlyoffice-ds 随本 compose 自动部署
      # 内网请求时浏览器加载 DS 的地址（生产请用 .env 覆盖）
      - ONLYOFFICE_DS_URL=${ONLYOFFICE_DS_URL:-http://127.0.0.1:8088}
      # 外网请求时浏览器加载 DS 的地址；DS 为 http 直连时必须用 http，https 页面会 Mixed Content 拦截
      - ONLYOFFICE_PUBLIC_DS_URL=${ONLYOFFICE_PUBLIC_DS_URL:-http://127.0.0.1:8088}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change-this-secret-please}
      # DS 后端下载 document.url / 回调的内网可达地址（compose 同网络直接用 web 服务名 zscx-web:3000）
      - ONLYOFFICE_INTERNAL_URL=${ONLYOFFICE_INTERNAL_URL:-http://zscx-web:3000}
      # 对象存储 (MinIO / S3 兼容)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio}
      - MINIO_PORT=${MINIO_PORT:-9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-zscxadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-zscxsecret123456}
      - MINIO_BUCKET=${MINIO_BUCKET:-zscx}
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      onlyoffice-ds:
        condition: service_healthy
    volumes:
      - uploads:/app/public/uploads
      - backups:/app/backups
    command: sh -c "node prisma/docker-migrate.js || true; npx prisma db push --accept-data-loss --skip-generate || true; node node_modules/next/dist/bin/next start -p 3000"

volumes:
  mysql_data:
  redis_data:
  minio_data:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_cache:
  onlyoffice_db:
  uploads:
  backups:
